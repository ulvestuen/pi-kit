<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Helvetica, Arial, sans-serif">
  <title>The PDCA loop: Plan, Do, Check, Act — iterate until every success criterion meets its bar</title>

  <rect width="900" height="640" fill="#ffffff"/>

  <text x="450" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a1a1a">The PDCA loop</text>
  <text x="450" y="70" text-anchor="middle" font-size="14" fill="#555">Define strict success criteria first, then cycle until every criterion meets its bar</text>

  <!-- Entry: success criteria -->
  <rect x="300" y="92" width="300" height="52" rx="8" fill="#f4f4f4" stroke="#999"/>
  <text x="450" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">0. Define success criteria</text>
  <text x="450" y="132" text-anchor="middle" font-size="12" fill="#555">measurable, scoreable 1–10, each with a pass bar (default 8/10)</text>
  <line x1="450" y1="144" x2="450" y2="176" stroke="#999" stroke-width="2" marker-end="url(#arrow-grey)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrow-grey" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#999"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2f855a"/>
    </marker>
  </defs>

  <!-- PLAN (top) -->
  <rect x="330" y="180" width="240" height="78" rx="10" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="450" y="206" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6cb0">PLAN</text>
  <text x="450" y="226" text-anchor="middle" font-size="12" fill="#333">state the single next step —</text>
  <text x="450" y="243" text-anchor="middle" font-size="12" fill="#333">target the weakest criterion first</text>

  <!-- DO (right) -->
  <rect x="620" y="330" width="240" height="78" rx="10" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="740" y="356" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6cb0">DO</text>
  <text x="740" y="376" text-anchor="middle" font-size="12" fill="#333">make the change for this step only,</text>
  <text x="740" y="393" text-anchor="middle" font-size="12" fill="#333">nothing more</text>

  <!-- CHECK (bottom) -->
  <rect x="330" y="480" width="240" height="78" rx="10" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="450" y="506" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6cb0">CHECK</text>
  <text x="450" y="526" text-anchor="middle" font-size="12" fill="#333">score every criterion 1–10, honestly —</text>
  <text x="450" y="543" text-anchor="middle" font-size="12" fill="#333">run real tests; no inflated scores</text>

  <!-- ACT (left) -->
  <rect x="40" y="330" width="240" height="78" rx="10" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="160" y="356" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6cb0">ACT</text>
  <text x="160" y="376" text-anchor="middle" font-size="12" fill="#333">all criteria at bar? → done.</text>
  <text x="160" y="393" text-anchor="middle" font-size="12" fill="#333">otherwise name the weakest, loop again</text>

  <!-- Cycle arrows -->
  <path d="M 575 230 Q 720 250 738 325" fill="none" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 738 413 Q 720 500 578 522" fill="none" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 325 522 Q 180 500 162 413" fill="none" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 162 325 Q 180 250 322 230" fill="none" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Exit -->
  <line x1="160" y1="330" x2="160" y2="270" stroke="#2f855a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="60" y="212" width="200" height="56" rx="8" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
  <text x="160" y="235" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f855a">DONE</text>
  <text x="160" y="254" text-anchor="middle" font-size="11.5" fill="#333">every criterion ≥ its bar, with evidence</text>

  <!-- Center note -->
  <text x="450" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#777">iterate</text>
  <text x="450" y="372" text-anchor="middle" font-size="11.5" fill="#777">one small step per pass;</text>
  <text x="450" y="388" text-anchor="middle" font-size="11.5" fill="#777">stop after ~10 passes and report</text>
  <text x="450" y="404" text-anchor="middle" font-size="11.5" fill="#777">what still fails rather than fake success</text>
</svg>
