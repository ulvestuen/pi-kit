<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Pi swarm</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161a21; --panel2: #1c212a; --line: #2a303b; --text: #d8dee9; --dim: #8a93a3;
    --accent: #7aa2f7; --working: #e0af68; --waiting: #9ece6a; --stopped: #8a93a3; --killed: #f7768e; --human: #bb9af7; --system: #565f89;
    --code: #0b0d11; --mention: rgba(122,162,247,.18);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f7f9; --panel:#fff; --panel2:#f0f2f5; --line:#dde1e7; --text:#1f2430; --dim:#667085; --code:#f3f4f6; --mention: rgba(59,105,214,.13); --accent:#3b69d6; --working:#b7791f; --waiting:#2f855a; --killed:#c53030; --human:#805ad5; --system:#718096; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; display: grid; grid-template-columns: 270px 1fr; grid-template-rows: auto 1fr auto; grid-template-areas: "side head" "side feed" "side composer"; }
  header { grid-area: head; padding: 10px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: baseline; min-width: 0; }
  header h1 { font-size: 15px; margin: 0; white-space: nowrap; }
  header .goal { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  #conn { font-size: 12px; color: var(--dim); white-space: nowrap; }
  #conn.live::before { content: "● "; color: var(--waiting); }
  #conn.down::before { content: "● "; color: var(--killed); }
  aside { grid-area: side; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 10px; }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 4px 6px 8px; }
  .member { display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent; color: inherit; font: inherit; border-radius: 8px; padding: 8px; margin-bottom: 4px; cursor: pointer; }
  .member:hover, .member.open { background: var(--panel2); border-color: var(--line); }
  .member .top { display: flex; align-items: center; gap: 6px; }
  .member .name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .member .meta { color: var(--dim); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .member .selection, .member .problem { white-space: normal; overflow-wrap: anywhere; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .badge.working, .badge.blocked { color: var(--working); } .badge.waiting { color: var(--waiting); } .badge.stopped { color: var(--stopped); } .badge.killed, .badge.failed { color: var(--killed); }
  .member .problem { color: var(--working); }
  .badge.working::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 4px; animation: pulse 1.2s infinite; vertical-align: 1px; }
  @keyframes pulse { 50% { opacity: .25; } }
  #queued { color: var(--dim); font-size: 12px; margin: 10px 6px; }
  main { grid-area: feed; overflow-y: auto; padding: 14px 18px; }
  .msg { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .msg .from { grid-row: span 2; }
  .sender { display: inline-block; font-weight: 600; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); white-space: nowrap; }
  .sender.human { color: var(--human); } .sender.system { color: var(--system); } .sender.coordinator { color: var(--accent); }
  .msg .head { color: var(--dim); font-size: 12px; display: flex; gap: 8px; }
  .msg .kind { text-transform: uppercase; font-size: 10px; letter-spacing: .06em; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .msg.system .body { color: var(--dim); }
  .body { min-width: 0; overflow-wrap: anywhere; }
  .body p { margin: 0 0 6px; } .body p:last-child { margin-bottom: 0; }
  .body ul, .body ol { margin: 2px 0 6px; padding-left: 22px; }
  .body h1, .body h2, .body h3, .body h4 { font-size: 14px; margin: 6px 0 4px; }
  .body pre { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; overflow-x: auto; margin: 4px 0 6px; }
  .body code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .body :not(pre) > code { background: var(--code); padding: 1px 4px; border-radius: 4px; }
  .body blockquote { margin: 4px 0; padding-left: 10px; border-left: 3px solid var(--line); color: var(--dim); }
  .body a { color: var(--accent); }
  .mention { background: var(--mention); color: var(--accent); border-radius: 4px; padding: 0 3px; font-weight: 600; }
  .empty { color: var(--dim); text-align: center; margin-top: 30vh; }
  footer { grid-area: composer; border-top: 1px solid var(--line); padding: 10px 18px; position: relative; background: var(--panel); }
  footer form:not([hidden]) { display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; min-height: 40px; max-height: 200px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font: inherit; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.send { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 0 16px; font: inherit; font-weight: 600; cursor: pointer; }
  button.send:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 4px; }
  #ac { position: absolute; bottom: calc(100% - 4px); left: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.3); min-width: 200px; padding: 4px; display: none; }
  #ac div { padding: 5px 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
  #ac div.sel { background: var(--panel2); color: var(--accent); }
  #ac span { color: var(--dim); font-size: 12px; }
  #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 92vw); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 30px rgba(0,0,0,.3); transform: translateX(100%); visibility: hidden; transition: transform .18s ease, visibility 0s .18s; display: flex; flex-direction: column; z-index: 5; }
  #drawer.open { transform: none; visibility: visible; transition: transform .18s ease; }
  #drawer .dh { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  #drawer .dh h3 { margin: 0; font-size: 15px; flex: 1; }
  #drawer .close { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 6px; cursor: pointer; padding: 2px 9px; font: inherit; }
  #tx { overflow-y: auto; padding: 10px 16px; flex: 1; font-size: 13px; }
  .tx { margin: 0 0 8px; border-left: 3px solid var(--line); padding: 2px 0 2px 10px; }
  .tx .lbl { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  .tx.user { border-color: var(--human); } .tx.assistant { border-color: var(--accent); } .tx.tool { border-color: var(--working); } .tx.tool.err { border-color: var(--killed); } .tx.sys { border-color: var(--system); color: var(--dim); }
  .tx details summary { cursor: pointer; }
  .tx pre { white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin: 4px 0; font: 12px ui-monospace, Menlo, Consolas, monospace; }
  .thinking { color: var(--dim); font-style: italic; white-space: pre-wrap; }
  #live { white-space: pre-wrap; color: var(--dim); }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-areas: "head" "side" "feed" "composer"; grid-template-rows: auto auto 1fr auto; } aside { max-height: 30vh; border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<header><h1 id="title">Pi swarm</h1><div class="goal" id="goal"></div><div id="conn">connecting…</div></header>
<aside><h2>Members</h2><div id="roster"></div><div id="queued"></div></aside>
<main id="feed"><div class="empty">No messages yet.</div></main>
<footer id="composer">
  <div id="ac" role="listbox"></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Post as human — @name or @all wakes members (Enter to send, Shift+Enter for a new line)"></textarea>
    <button class="send" id="send" type="submit">Post</button>
  </form>
  <div class="hint" id="hint"></div>
</footer>
<section id="drawer" aria-hidden="true">
  <div class="dh"><h3 id="dtitle"></h3><span id="dbadge"></span><button class="close" id="dclose" type="button">Close</button></div>
  <div id="tx"></div>
</section>
<script>
"use strict";
const token = new URLSearchParams(location.search).get("t") || "";
const api = (path, init = {}) => fetch(path + (path.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(token), { ...init, headers: { "content-type": "application/json", ...(init.headers || {}) } });
const $ = (id) => document.getElementById(id);
const state = { roster: { members: [] }, board: [], queued: [], open: null, records: [], live: "" };

// ---- rendering helpers (everything is escaped before markdown is applied) ----
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const names = () => new Set(state.roster.members.map((m) => m.name).concat(["all", "human", "coordinator"]));
function mentions(html) {
  const known = names();
  return html.replace(/(^|[^\w.@/&#;-])@([a-zA-Z][\w-]*)/g, (m, pre, name) => (known.has(name.toLowerCase().replace(/-+$/, "")) ? `${pre}<span class="mention">@${name}</span>` : m));
}
function inline(s) {
  const codes = [];
  s = s.replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  s = esc(s)
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<em>$2</em>")
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s = mentions(s);
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[+i])}</code>`);
}
function markdown(src) {
  const out = [];
  const lines = String(src).replace(/\r\n?/g, "\n").split("\n");
  let i = 0, para = [], list = null;
  const flushPara = () => { if (para.length) out.push(`<p>${para.map(inline).join("<br>")}</p>`); para = []; };
  const flushList = () => { if (list) out.push(`<${list.tag}>${list.items.map((x) => `<li>${inline(x)}</li>`).join("")}</${list.tag}>`); list = null; };
  while (i < lines.length) {
    const line = lines[i];
    const fence = line.match(/^\s*```\s*([\w+-]*)/);
    if (fence) {
      flushPara(); flushList();
      const body = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) body.push(lines[i++]);
      i++;
      out.push(`<pre><code${fence[1] ? ` data-lang="${esc(fence[1])}"` : ""}>${esc(body.join("\n"))}</code></pre>`);
      continue;
    }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    const q = line.match(/^>\s?(.*)$/);
    if (h) { flushPara(); flushList(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); }
    else if (ul || ol) {
      flushPara();
      const tag = ul ? "ul" : "ol";
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
      list.items.push((ul || ol)[1]);
    } else if (q) { flushPara(); flushList(); out.push(`<blockquote>${inline(q[1])}</blockquote>`); }
    else if (!line.trim()) { flushPara(); flushList(); }
    else { flushList(); para.push(line); }
    i++;
  }
  flushPara(); flushList();
  return out.join("");
}
const time = (ts) => { const d = new Date(ts); return isNaN(d) ? "" : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }); };
const senderClass = (from) => (["human", "system", "coordinator"].includes(from) ? from : "");
const harnessLabel = (harness) => ({ pi: "Pi", claude: "Claude Code", codex: "Codex", agy: "Antigravity CLI" })[harness || "pi"];

// ---- roster ----
function renderRoster() {
  const box = $("roster");
  box.replaceChildren();
  for (const m of state.roster.members) {
    const b = document.createElement("button");
    b.className = "member" + (state.open === m.name ? " open" : "");
    b.type = "button";
    const where = m.workspace === "worktree" ? `⎇ ${m.branch || "worktree"}` : m.workspace === "coordinator" ? "this session" : "shared checkout";
    const selection = `${harnessLabel(m.harness)} · ${m.model || "default model"}${m.effort ? ` (${m.effort})` : ""}`;
    b.innerHTML = `<div class="top"><span class="name">@${esc(m.name)}</span><span class="badge ${esc(m.state)}">${esc(m.state)}</span></div>
      <div class="meta selection">${esc(selection)}</div>
      <div class="meta" title="${esc(m.cwd || "")}">${esc(where)}</div>
      ${m.problem ? `<div class="meta problem">${esc(m.problem)}</div>` : ""}`;
    b.onclick = () => openDrawer(m.name);
    box.append(b);
  }
  $("queued").textContent = state.queued.length ? `Queued (concurrency cap): ${state.queued.map((n) => "@" + n).join(", ")}` : "";
  if (state.open) {
    const m = state.roster.members.find((x) => x.name === state.open);
    $("dbadge").innerHTML = m ? `<span class="badge ${esc(m.state)}">${esc(m.state)}</span>` : "";
  }
}

// ---- board ----
function messageEl(m) {
  const el = document.createElement("div");
  el.className = "msg" + (m.from === "system" ? " system" : "");
  el.id = "m" + m.id;
  el.innerHTML = `<div class="from"><span class="sender ${senderClass(m.from)}">@${esc(m.from)}</span></div>
    <div class="head"><span>#${m.id}</span><span>${esc(time(m.ts))}</span>${m.kind !== "message" ? `<span class="kind">${esc(m.kind)}</span>` : ""}</div>
    <div class="body">${markdown(m.body)}</div>`;
  return el;
}
function renderBoard() {
  const feed = $("feed");
  feed.replaceChildren();
  if (!state.board.length) { feed.innerHTML = '<div class="empty">No messages yet.</div>'; return; }
  for (const m of state.board) feed.append(messageEl(m));
  feed.scrollTop = feed.scrollHeight;
}
function addMessage(m) {
  if (state.board.some((x) => x.id === m.id)) return;
  state.board.push(m);
  const feed = $("feed");
  const stick = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
  if (state.board.length === 1) feed.replaceChildren();
  feed.append(messageEl(m));
  if (stick) feed.scrollTop = feed.scrollHeight;
}

// ---- transcript drawer ----
const textOf = (content) => (typeof content === "string" ? content : Array.isArray(content) ? content.filter((c) => c.type === "text").map((c) => c.text).join("\n") : "");
const short = (v, n = 4000) => { const s = typeof v === "string" ? v : JSON.stringify(v, null, 2); return s && s.length > n ? s.slice(0, n) + `\n… (${s.length - n} more chars)` : s || ""; };
function recordEl(r) {
  const el = document.createElement("div");
  if (r.type === "wake") { el.className = "tx user"; el.innerHTML = `<div class="lbl">wake · ${esc(time(r.ts))}</div><details><summary>board messages delivered</summary><pre>${esc(r.text)}</pre></details>`; return el; }
  if (r.type === "tool_execution_start") { el.className = "tx tool"; el.innerHTML = `<div class="lbl">tool · ${esc(r.toolName)}</div><pre>${esc(short(r.args, 1500))}</pre>`; return el; }
  if (r.type === "tool_execution_end") {
    el.className = "tx tool" + (r.isError ? " err" : "");
    const out = textOf(r.result && r.result.content);
    el.innerHTML = `<div class="lbl">${r.isError ? "error" : "result"} · ${esc(r.toolName)}${r.durationMs != null ? ` · ${Math.round(r.durationMs)}ms` : ""}</div><details${r.isError ? " open" : ""}><summary>${esc(out.split("\n")[0].slice(0, 120) || "(no text output)")}</summary><pre>${esc(short(out))}</pre></details>`;
    return el;
  }
  if (r.type === "message_end" && r.message) {
    const m = r.message;
    if (m.role === "assistant") {
      el.className = "tx assistant";
      const parts = (m.content || []).map((c) => c.type === "text" ? `<div class="body">${markdown(c.text)}</div>` : c.type === "thinking" && c.thinking ? `<details><summary class="thinking">thinking</summary><div class="thinking">${esc(c.thinking)}</div></details>` : c.type === "toolCall" ? `<div class="lbl">→ calls ${esc(c.name)}</div>` : "").join("");
      el.innerHTML = `<div class="lbl">assistant · ${esc(time(r.ts))}${m.errorMessage ? " · " + esc(m.errorMessage) : ""}</div>${parts}`;
      return el;
    }
    return null; // user/tool-result messages are shown via wake and tool records
  }
  if (r.type === "agent_settled") { el.className = "tx sys"; el.innerHTML = `<div class="lbl">turn settled${r.aborted ? " (aborted)" : ""} · waiting · ${esc(time(r.ts))}</div>`; return el; }
  if (r.type === "agent_start" || r.type === "turn_cancelled" || r.type === "native_session") {
    const label = r.type === "agent_start" ? "worker started" : r.type === "turn_cancelled" ? "turn cancelled" : r.resumed ? "native session resumed" : "native session started";
    el.className = "tx sys"; el.innerHTML = `<div class="lbl">${label} · ${esc(time(r.ts))}</div>`; return el;
  }
  if (r.type === "turn_failed") { el.className = "tx tool err"; el.innerHTML = `<div class="lbl">turn failed · ${esc(r.failure)}</div><div>${esc(r.reason)}</div>`; return el; }
  if (r.type === "exit" || r.type === "extension_error" || r.type === "auto_retry_start") { el.className = "tx sys"; el.innerHTML = `<div class="lbl">${esc(r.type)}</div><pre>${esc(short(r))}</pre>`; return el; }
  return null;
}
function renderTranscript() {
  const tx = $("tx");
  const stick = tx.scrollHeight - tx.scrollTop - tx.clientHeight < 80;
  tx.replaceChildren();
  for (const r of state.records) { const el = recordEl(r); if (el) tx.append(el); }
  if (!tx.children.length) tx.innerHTML = '<div class="empty" style="margin-top:20vh">No activity yet.</div>';
  const live = document.createElement("div"); live.id = "live"; live.textContent = state.live; tx.append(live);
  if (stick) tx.scrollTop = tx.scrollHeight;
}
async function openDrawer(name) {
  state.open = name; state.records = []; state.live = "";
  const member = state.roster.members.find((m) => m.name === name);
  $("dtitle").textContent = `@${name} · ${harnessLabel(member?.harness)}`;
  $("drawer").classList.add("open"); $("drawer").setAttribute("aria-hidden", "false");
  renderRoster(); renderTranscript();
  const res = await api(`/api/workers/${encodeURIComponent(name)}/transcript`);
  if (res.ok && state.open === name) { state.records = (await res.json()).records; renderTranscript(); $("tx").scrollTop = $("tx").scrollHeight; }
}
$("dclose").onclick = () => { state.open = null; $("drawer").classList.remove("open"); $("drawer").setAttribute("aria-hidden", "true"); renderRoster(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.open && $("ac").style.display !== "block") $("dclose").onclick(); });

// ---- live updates ----
function applySnapshot(s) {
  state.roster = s.roster; state.board = s.board; state.queued = s.queued || [];
  $("title").textContent = "Pi swarm " + s.id;
  $("goal").textContent = s.goal; $("goal").title = s.goal;
  document.title = "swarm · " + s.goal.slice(0, 60);
  $("hint").textContent = `Limits: ${s.limits.maxActive} active, ${s.limits.maxWorkers} workers · state in ${s.dir}`;
  renderRoster();
  renderBoard();
}
function connect() {
  const es = new EventSource("/api/events?t=" + encodeURIComponent(token));
  es.addEventListener("open", () => { $("conn").className = "live"; $("conn").textContent = "live"; });
  es.addEventListener("error", () => { $("conn").className = "down"; $("conn").textContent = "reconnecting…"; });
  es.addEventListener("snapshot", (e) => applySnapshot(JSON.parse(e.data)));
  es.addEventListener("board", (e) => addMessage(JSON.parse(e.data)));
  es.addEventListener("roster", (e) => { const d = JSON.parse(e.data); state.roster.members = d.members; state.queued = d.queued || []; renderRoster(); });
  es.addEventListener("transcript", (e) => {
    const { name, record } = JSON.parse(e.data);
    if (name !== state.open) return;
    if (record.type === "delta") { if (record.kind === "text_delta") { state.live += record.delta; const l = $("live"); if (l) l.textContent = state.live.slice(-3000); } return; }
    if (record.type === "message_end" || record.type === "agent_settled") state.live = "";
    state.records.push(record); renderTranscript();
  });
}

// ---- composer with @mention autocomplete ----
const input = $("input"), ac = $("ac");
let acItems = [], acSel = 0;
function mentionPrefix() {
  const before = input.value.slice(0, input.selectionStart);
  const m = before.match(/(^|\s)@([\w-]*)$/);
  return m ? m[2] : null;
}
function updateAc() {
  const prefix = mentionPrefix();
  if (prefix === null) { ac.style.display = "none"; acItems = []; return; }
  const members = state.roster.members.filter((m) => m.state !== "killed").map((m) => ({ name: m.name, note: m.state }));
  acItems = [{ name: "all", note: "everyone" }, ...members].filter((x) => x.name.startsWith(prefix.toLowerCase()));
  if (!acItems.length) { ac.style.display = "none"; return; }
  acSel = Math.min(acSel, acItems.length - 1);
  ac.innerHTML = acItems.map((x, i) => `<div class="${i === acSel ? "sel" : ""}" data-i="${i}">@${esc(x.name)}<span>${esc(x.note)}</span></div>`).join("");
  ac.style.display = "block";
}
function pick(i) {
  const item = acItems[i]; if (!item) return;
  const pos = input.selectionStart;
  const before = input.value.slice(0, pos).replace(/@([\w-]*)$/, "@" + item.name + " ");
  input.value = before + input.value.slice(pos);
  input.selectionStart = input.selectionEnd = before.length;
  ac.style.display = "none"; acItems = []; input.focus(); autosize();
}
ac.addEventListener("mousedown", (e) => { const d = e.target.closest("[data-i]"); if (d) { e.preventDefault(); pick(+d.dataset.i); } });
const autosize = () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 200) + "px"; };
input.addEventListener("input", () => { acSel = 0; updateAc(); autosize(); });
input.addEventListener("click", updateAc);
input.addEventListener("keydown", (e) => {
  if (acItems.length && ac.style.display === "block") {
    if (e.key === "ArrowDown") { acSel = (acSel + 1) % acItems.length; updateAc(); e.preventDefault(); return; }
    if (e.key === "ArrowUp") { acSel = (acSel - 1 + acItems.length) % acItems.length; updateAc(); e.preventDefault(); return; }
    if (e.key === "Tab" || e.key === "Enter") { pick(acSel); e.preventDefault(); return; }
    if (e.key === "Escape") { ac.style.display = "none"; acItems = []; e.preventDefault(); return; }
  }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
});
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = input.value.trim(); if (!body) return;
  $("send").disabled = true;
  try {
    const res = await api("/api/board", { method: "POST", body: JSON.stringify({ body }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.status);
    addMessage(data);
    input.value = ""; autosize();
    $("hint").textContent = data.mentions.length ? `Posted #${data.id}; woke ${data.mentions.map((m) => "@" + m).join(", ")}` : `Posted #${data.id} (no @mentions: nobody was woken)`;
  } catch (err) { $("hint").textContent = "Post failed: " + err.message; }
  finally { $("send").disabled = false; input.focus(); }
});

connect();
</script>
</body>
