<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="DejaVu Sans, Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Orchestration owns the workflow; PDCA runs inside a bounded task</title>
  <desc id="description">The parent sets the outcome, chooses ready work, dispatches it, and verifies the integrated result. A task owner can use an optional Plan-Do-Check-Act loop. User checkpoints and independent auditors are optional. Evidence can reopen work; only an accepted overall outcome ends the workflow.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrow-grey" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#777"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2f855a"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="#fff"/>
  <text x="640" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a1a1a">Orchestrate</text>
  <text x="640" y="73" text-anchor="middle" font-size="15" fill="#555">One owner for the outcome. Optional roles and loops where they help.</text>

  <rect x="24" y="100" width="1232" height="502" rx="10" fill="#fafafa" stroke="#999"/>
  <text x="48" y="128" font-size="15" font-weight="bold" fill="#555">PARENT ORCHESTRATION · goals, dependencies, ownership, integration</text>

  <!-- Establish the goal and choose work; involve the user only when needed. -->
  <rect x="50" y="156" width="200" height="74" rx="8" fill="#f4f4f4" stroke="#999"/>
  <text x="150" y="184" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Outcome</text>
  <text x="150" y="202" text-anchor="middle" font-size="13" fill="#555">constraints +</text>
  <text x="150" y="219" text-anchor="middle" font-size="13" fill="#555">success evidence</text>
  <path d="M250 193 H300" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="156" width="320" height="74" rx="8" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="460" y="184" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6cb0">Discover · decide · deliver</text>
  <text x="460" y="208" text-anchor="middle" font-size="13" fill="#333">choose ready work; keep dependents blocked</text>

  <path d="M628 193 H705" fill="none" stroke="#777" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#arrow-grey)" marker-end="url(#arrow-grey)"/>
  <rect x="705" y="156" width="260" height="74" rx="8" fill="#fff" stroke="#999" stroke-dasharray="5 4"/>
  <text x="835" y="184" text-anchor="middle" font-size="17" font-weight="bold" fill="#555">User checkpoint · optional</text>
  <text x="835" y="208" text-anchor="middle" font-size="13" fill="#555">consequential preference or approval</text>

  <!-- Evidence feeds back to the parent's decision, not to a global PDCA score. -->
  <path d="M775 310 V270 H460 V230" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="610" y="259" text-anchor="middle" font-size="12" fill="#2b6cb0">revise the plan or reopen a task</text>
  <path d="M350 230 V310" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="338" y="287" text-anchor="end" font-size="12" fill="#2b6cb0">ready task</text>

  <!-- PDCA is visibly nested in execution of a bounded task. -->
  <rect x="50" y="310" width="570" height="240" rx="10" fill="#fff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="76" y="340" font-size="18" font-weight="bold" fill="#2b6cb0">Bounded task</text>
  <text x="76" y="389" font-size="15" font-weight="bold" fill="#333">Task owner</text>
  <text x="76" y="415" font-size="14" fill="#555">parent or implementer</text>
  <text x="76" y="445" font-size="13" fill="#555">one scope + acceptance bar</text>
  <text x="76" y="470" font-size="13" fill="#555">direct work by default</text>

  <rect x="290" y="366" width="300" height="146" rx="8" fill="#ebf4ff" stroke="#2b6cb0" stroke-dasharray="5 4"/>
  <text x="440" y="391" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6cb0">PDCA · optional task-local loop</text>
  <g font-size="13" text-anchor="middle" fill="#333">
    <rect x="312" y="408" width="100" height="30" rx="4" fill="#fff" stroke="#2b6cb0"/>
    <text x="362" y="428">Plan</text>
    <rect x="468" y="408" width="100" height="30" rx="4" fill="#fff" stroke="#2b6cb0"/>
    <text x="518" y="428">Do</text>
    <rect x="468" y="470" width="100" height="30" rx="4" fill="#fff" stroke="#2b6cb0"/>
    <text x="518" y="490">Check</text>
    <rect x="312" y="470" width="100" height="30" rx="4" fill="#fff" stroke="#2b6cb0"/>
    <text x="362" y="490">Act</text>
  </g>
  <g fill="none" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M412 423 H468"/>
    <path d="M518 438 V470"/>
    <path d="M468 485 H412"/>
    <path d="M362 470 V438"/>
  </g>
  <text x="335" y="534" text-anchor="middle" font-size="12" fill="#555">Return result + evidence, or unmet criteria + blocker</text>

  <!-- Parent acceptance is outside the task-local loop. -->
  <path d="M620 350 H705" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="705" y="310" width="260" height="80" rx="8" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="835" y="339" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6cb0">Verify + integrate</text>
  <text x="835" y="364" text-anchor="middle" font-size="13" fill="#333">parent checks the combined outcome</text>

  <path d="M835 398 V450" fill="none" stroke="#777" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#arrow-grey)" marker-end="url(#arrow-grey)"/>
  <rect x="705" y="450" width="260" height="90" rx="8" fill="#fff" stroke="#999" stroke-dasharray="5 4"/>
  <text x="835" y="478" text-anchor="middle" font-size="17" font-weight="bold" fill="#555">Auditor · optional</text>
  <text x="835" y="502" text-anchor="middle" font-size="13" fill="#555">independent command evidence</text>
  <text x="835" y="524" text-anchor="middle" font-size="12" fill="#555">acceptance · regression · scope</text>

  <path d="M965 350 H1035" fill="none" stroke="#2f855a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="1000" y="337" text-anchor="middle" font-size="12" fill="#2f855a">accepted</text>
  <rect x="1035" y="310" width="190" height="80" rx="8" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
  <text x="1130" y="339" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f855a">Done</text>
  <text x="1130" y="360" text-anchor="middle" font-size="13" fill="#333">overall outcome</text>
  <text x="1130" y="379" text-anchor="middle" font-size="13" fill="#333">has evidence</text>

  <text x="640" y="627" text-anchor="middle" font-size="13" fill="#555">Scouts and planners support discovery; critics inspect risks. No mandatory role pipeline.</text>
</svg>
